name: stock_investment_tracker
description: "Stock Book — track your Pakistan Stock Exchange portfolio, live prices, and price alerts."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  go_router: ^17.3.0
  firebase_core: ^4.12.1
  firebase_auth: ^6.6.1
  cloud_firestore: ^6.7.1
  google_sign_in: ^6.2.2
  fl_chart: ^1.2.0
  flutter_animate: ^4.5.2
  flutter_staggered_animations: ^1.1.1
  shimmer: ^3.0.0
  google_fonts: ^8.2.1
  hive_flutter: ^1.1.0
  hive: ^2.2.3
  connectivity_plus: ^7.3.1
  intl: ^0.20.3
  uuid: ^4.6.0
  share_plus: ^11.0.0
  logger: ^2.7.0
  equatable: ^2.1.0
  freezed_annotation: ^3.1.0
  json_annotation: 4.9.0
  firebase_crashlytics: ^5.2.6
  firebase_analytics: ^12.4.5
  flutter_native_splash: ^2.4.8
  flutter_launcher_icons: ^0.14.4
  flutter_slidable: ^4.0.3
  pdf: ^3.10.8
  printing: ^5.13.1
  url_launcher: ^6.3.1
  flutter_svg: ^2.0.10+1
  rxdart: ^0.28.0
  firebase_messaging: ^16.6.0
  flutter_local_notifications: ^22.3.0
  # On-demand backend refresh: calls GitHub's workflow_dispatch API with a
  # token the user supplies themselves. The token lives only in
  # flutter_secure_storage (Android Keystore) on the device — never in this
  # repo, never compiled into the APK.
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2
  font_awesome_flutter: ^11.0.0
  package_info_plus: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  very_good_analysis: any
  riverpod_generator: any
  build_runner: any
  freezed: any
  json_serializable: any
  mockito: any
  mocktail: any
  golden_toolkit: any
  custom_lint: any

  riverpod_lint: any

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icon/Stockk.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/Stockk.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  # assets/screenshots/ deliberately not bundled here — those 4 files are
  # unused by the running app (nothing in lib/ references them; they're
  # old design-reference mockups) and were bloating every build. They're
  # still on disk if useful as a starting point for real Play Store
  # screenshots, just no longer shipped inside the app itself.
  assets:
    - assets/icon/

  # Bundled locally so widget/golden tests can render real Outfit/Inter text
  # via golden_toolkit's loadAppFonts() without network access. The app
  # itself still fetches these through google_fonts at runtime as before —
  # this declaration exists for test determinism, not for the shipped app.
  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Outfit-Bold.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
