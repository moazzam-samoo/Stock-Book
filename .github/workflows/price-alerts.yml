name: Price alerts

on:
  schedule:
    # Every 15 minutes, 09:15-15:30 PKT (04:15-10:30 UTC), Mon-Fri — a
    # low-frequency BACKUP only. GitHub's own schedule trigger never fired
    # once on this repo (confirmed via the Actions API: zero schedule runs
    # across its entire first eligible day, both at */5 and */10, despite
    # being active on main and workflow_dispatch working every time). The
    # real 5-minute cadence during market hours is now driven externally
    # by a cron-job.org job hitting this workflow's `dispatches` API
    # endpoint directly — see WorkflowTriggerService for the same call
    # made on-demand from the app. This schedule stays in as a cheap
    # second line of defence in case that external job ever lapses; it
    # deliberately no longer needs to be frequent since it isn't the
    # primary mechanism anymore.
    #
    # This only actually fires from whatever's on the repo's DEFAULT branch
    # — GitHub ignores `schedule:` on any other branch (workflow_dispatch
    # still works from any branch, which is handy for testing before a
    # merge to main).
    #
    # Scheduled workflows are auto-disabled by GitHub after 60 days with no
    # repository activity at all. If this repo goes quiet, alerts stop
    # firing silently, with no error anywhere in this workflow's own logs
    # (it simply never runs). The app's own staleness indicator (Phase 04)
    # is the user-facing mitigation; a monthly no-op commit is a cheap
    # backstop if that's not enough.
    - cron: '*/15 4-10 * * 1-5'
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r scripts/price_alerts/requirements.txt

      - name: Write service account credentials
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}' > service-account.json

      - name: Run price alerts
        env:
          FIREBASE_SERVICE_ACCOUNT_PATH: service-account.json
        run: python scripts/price_alerts/main.py

      - name: Clean up credentials
        if: always()
        run: rm -f service-account.json
