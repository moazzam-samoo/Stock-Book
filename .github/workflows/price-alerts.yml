name: Price alerts

on:
  schedule:
    # Every 10 minutes, 09:15-15:30 PKT (04:15-10:30 UTC), Mon-Fri.
    # Pakistan does not observe DST, so this offset is stable year-round.
    #
    # Was */5 (GitHub's documented minimum) until 2026-09-07, when it
    # turned out to never fire at all on this repo — GitHub's own docs say
    # high-frequency (5-minute) crons are the first dropped under load,
    # which matches: zero schedule-triggered runs ever, across the entire
    # first eligible day, while workflow_dispatch worked the whole time.
    # 10 minutes is the cheap first thing to try before reaching for an
    # external scheduler (e.g. Cloud Scheduler hitting the dispatches API)
    # to drive this instead of relying on GitHub's own cron.
    #
    # This only actually fires from whatever's on the repo's DEFAULT branch
    # — GitHub ignores `schedule:` on any other branch (workflow_dispatch
    # still works from any branch, which is handy for testing before a
    # merge to main).
    #
    # GitHub's scheduler can also fail to pick up a newly-registered cron
    # on its very first eligible day even once this file IS on main — the
    # registration seems to need the file's own content to change, not
    # just have main's tip move past it via a merge commit. If scheduled
    # runs still aren't appearing, a trivial edit to this file (like this
    # comment) and a push to main is the known nudge.
    #
    # Scheduled workflows are auto-disabled by GitHub after 60 days with no
    # repository activity at all. If this repo goes quiet, alerts stop
    # firing silently, with no error anywhere in this workflow's own logs
    # (it simply never runs). The app's own staleness indicator (Phase 04)
    # is the user-facing mitigation; a monthly no-op commit is a cheap
    # backstop if that's not enough.
    - cron: '*/10 4-10 * * 1-5'
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r scripts/price_alerts/requirements.txt

      - name: Write service account credentials
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}' > service-account.json

      - name: Run price alerts
        env:
          FIREBASE_SERVICE_ACCOUNT_PATH: service-account.json
        run: python scripts/price_alerts/main.py

      - name: Clean up credentials
        if: always()
        run: rm -f service-account.json
